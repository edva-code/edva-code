<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="14">
  <defs>
    <!-- each command is "typed" by widening a clip rect; plays once, then fill="freeze" keeps the final frame on screen -->
    <clipPath id="c1"><rect x="0" y="40" height="30" width="0"><animate attributeName="width" from="0" to="720" begin="0.5s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="0" y="88" height="30" width="0"><animate attributeName="width" from="0" to="720" begin="2s" dur="0.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="0" y="136" height="30" width="0"><animate attributeName="width" from="0" to="720" begin="3.6s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="0" y="184" height="30" width="0"><animate attributeName="width" from="0" to="720" begin="5.1s" dur="0.8s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect width="720" height="290" rx="10" fill="#1a1b26"/>
  <rect width="720" height="32" rx="10" fill="#24283b"/>
  <rect y="22" width="720" height="10" fill="#24283b"/>
  <circle cx="20" cy="16" r="6" fill="#f7768e"/>
  <circle cx="40" cy="16" r="6" fill="#e0af68"/>
  <circle cx="60" cy="16" r="6" fill="#9ece6a"/>
  <text x="360" y="21" fill="#565f89" text-anchor="middle" font-size="12">edvinas@vu: ~</text>

  <g fill="#c0caf5">
    <text x="20" y="60" clip-path="url(#c1)"><tspan fill="#9ece6a">➜</tspan> <tspan fill="#7aa2f7">~</tspan> whoami</text>
    <text x="20" y="84" opacity="0">Edvinas Ryliškis · Software Engineering student @ Vilnius University<set attributeName="opacity" to="1" begin="1.4s" fill="freeze"/></text>

    <text x="20" y="108" clip-path="url(#c2)"><tspan fill="#9ece6a">➜</tspan> <tspan fill="#7aa2f7">~</tspan> cat interests.txt</text>
    <text x="20" y="132" opacity="0" fill="#bb9af7">Machine Learning · Data Engineering · Artificial Intelligence · Music<set attributeName="opacity" to="1" begin="3s" fill="freeze"/></text>

    <text x="20" y="156" clip-path="url(#c3)"><tspan fill="#9ece6a">➜</tspan> <tspan fill="#7aa2f7">~</tspan> ls projects/</text>
    <text x="20" y="180" xml:space="preserve" opacity="0" fill="#7dcfff">Bassova  ai-agent-pr-checker  live-translator<set attributeName="opacity" to="1" begin="4.5s" fill="freeze"/></text>

    <text x="20" y="204" clip-path="url(#c4)"><tspan fill="#9ece6a">➜</tspan> <tspan fill="#7aa2f7">~</tspan> cat stack.txt</text>
    <text x="20" y="228" opacity="0" fill="#e0af68">Python · SQL/PostgreSQL · dbt · Pandas · NumPy · C# · Git · Linux<set attributeName="opacity" to="1" begin="6.1s" fill="freeze"/></text>

    <text x="20" y="262" opacity="0"><tspan fill="#9ece6a">➜</tspan> <tspan fill="#7aa2f7">~</tspan><set attributeName="opacity" to="1" begin="6.6s" fill="freeze"/></text>
    <g opacity="0">
      <set attributeName="opacity" to="1" begin="6.6s" fill="freeze"/>
      <rect x="58" y="249" width="9" height="17" fill="#c0caf5">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
